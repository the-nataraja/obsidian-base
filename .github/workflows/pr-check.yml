name: Check Contributing Rules

on:
  pull_request:
    branches:
      - main

jobs:
  validate-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: pip install pyyaml

      - name: Получение списка измененных файлов
        run: |
          echo "Базовый коммит: ${{ github.event.pull_request.base.sha }}"
          echo "Текущий коммит: ${{ github.event.pull_request.head.sha }}"
          
          git diff --name-only --diff-filter=d ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > changed_files.txt
          
          echo "--- СОДЕРЖИМОЕ ФАЙЛА changed_files.txt ---"
          cat changed_files.txt
          echo "------------------------------------------"

      - name: Запуск валидатора
        run: python .github/scripts/validate_contributing.py
