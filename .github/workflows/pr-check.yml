name: Check Contributing Rules

on:
  pull_request:
    branches:
      - main

jobs:
  validate-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: pip install pyyaml

      - name: Получение списка измененных файлов
        run: |
          git diff --name-only --diff-filter=d origin/${{ github.base_ref }} HEAD > changed_files.txt
          echo "Файлы для проверки:"
          cat changed_files.txt

      - name: Запуск валидатора
        run: python .github/scripts/validate_contributing.py
